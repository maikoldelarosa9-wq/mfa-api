<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.gg — Panel de Administración & Licencias</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0a0a0c;
            --border-color: #1a1a1e;
            --border-focus: #44444f;
            --accent-color: #ffffff;
            --text-main: #ededed;
            --text-muted: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 1050px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 25px; margin-bottom: 30px; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo-box { width: 38px; height: 38px; background: #111; border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: #fff; }
        .subtitle { font-size: 12px; color: var(--text-muted); }

        input[type="password"], input[type="text"] {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 1px solid var(--border-color);
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }
        input[type="password"]:focus, input[type="text"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.05);
        }
        input::placeholder { color: #555555; }

        .login-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .admin-input { width: 150px; }

        .btn { background: #ffffff; color: #000000; border: none; padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-danger { background: #ff3b30; color: #fff; }
        .btn-success { background: #34c759; color: #fff; }
        .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 8px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; }
        .stat-card h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-card p { font-size: 26px; font-weight: 800; color: #fff; }

        .panel-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 25px; }
        .panel-title { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .admin-nav-banner { background: linear-gradient(135deg, #111115, #0a0a0c); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 14px; color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid var(--border-color); letter-spacing: 0.5px; }
        td { padding: 14px; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .font-mono { font-family: monospace; font-weight: bold; color: #34c759; }
        .url-link { color: #0a84ff; text-decoration: none; } .url-link:hover { text-decoration: underline; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-active { background: rgba(52, 199, 89, 0.1); color: #34c759; }
        .badge-used { background: rgba(255, 59, 48, 0.1); color: #ff3b30; }
        .badge-exhausted { background: rgba(142, 142, 147, 0.1); color: #aeaeb2; }
    </style>
</head>
